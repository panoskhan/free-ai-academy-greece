name: Academy QA

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate core files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html about/index.html academy-standard/index.html
            courses/index.html courses/ai-foundations.html courses/prompt-engineering.html courses/web-foundations.html courses/first-ai-tool.html courses/github-self-hosting.html courses/responsible-ai.html
            lessons/ai-foundations.html
            student-path/index.html student-dashboard/index.html portfolio/index.html projects/index.html assessment/index.html accessibility/index.html certificates/index.html contact/index.html privacy/index.html terms/index.html
            builder/index.html builder/project.html
            creator-dashboard/index.html creator-dashboard/workspace.html creator-dashboard/academy-editor.html creator-dashboard/academy-manager.html creator-dashboard/github-connect.html creator-dashboard/deployment-dashboard.html creator-dashboard/website-project.html
            preview/index.html
            release-center/index.html release-center/history.html release-center/audit-log.html
            qa/link-checklist.html qa/launch-checklist.html qa/website-builder-contract-test.js qa/smoke-test.py
            website-builder/index.html website-builder/project.html website-builder/contract-bridge.js
            data/academy-store.js data/creator-workspace-store.js
            sitemap.xml robots.txt manifest.webmanifest 404.html
            data/academy-model.json data/example-academy.json data/release-audit-schema.json data/website-project-model.json data/assessment-record-schema.json data/portfolio-record-schema.json data/website-builder-contract.json
          )
          for f in "${files[@]}"; do test -f "$f" || { echo "Missing: $f"; exit 1; }; done
          echo "Core files present: ${#files[@]}"

      - name: Check HTML basics
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' f; do
            grep -qi '<!doctype html>' "$f" || { echo "No doctype: $f"; bad=1; }
            grep -qi 'lang="el"' "$f" || { echo "Missing Greek lang: $f"; bad=1; }
            grep -qi '<meta charset=' "$f" || { echo "Missing charset: $f"; bad=1; }
            grep -qi 'name="viewport"' "$f" || { echo "Missing viewport: $f"; bad=1; }
            grep -qi '<title>' "$f" || { echo "Missing title: $f"; bad=1; }
            grep -qi 'name="description"' "$f" || { echo "Missing meta description: $f"; bad=1; }
          done < <(find . -name '*.html' -not -path './.git/*' -print0)
          test "$bad" -eq 0

      - name: Check JavaScript and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          js_count=0
          while IFS= read -r -d '' f; do
            node --check "$f"
            js_count=$((js_count+1))
          done < <(find . -name '*.js' -not -path './.git/*' -print0)
          python3 -m py_compile qa/smoke-test.py
          echo "JavaScript syntax OK: $js_count files"
          echo "Python syntax OK"

      - name: Validate JSON and Website Builder contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=['data/academy-model.json','data/example-academy.json','data/release-audit-schema.json','data/website-project-model.json','data/assessment-record-schema.json','data/portfolio-record-schema.json','data/website-builder-contract.json']
          for name in files:
              obj=json.loads(Path(name).read_text(encoding='utf-8'))
              assert isinstance(obj,(dict,list)), name
              print('JSON OK:',name)
          model=json.loads(Path('data/website-project-model.json').read_text(encoding='utf-8'))
          text=json.dumps(model).lower()
          for required in ('pages','sections','versions','status','qa','preview','deployment'): assert required in text, f'Website model missing {required}'
          assessment=json.loads(Path('data/assessment-record-schema.json').read_text(encoding='utf-8'))
          for key in ('schema','exportedAt','project','checks','scores','readiness'): assert key in assessment['required']
          assert assessment['properties']['schema']['const']=='faa-assessment-record/v2'
          assert assessment['properties']['checks']['minItems']==9
          assert assessment['properties']['scores']['minItems']==7
          portfolio=json.loads(Path('data/portfolio-record-schema.json').read_text(encoding='utf-8'))
          assert portfolio['properties']['schema']['const']=='faa-portfolio-record/v1'
          assert portfolio['properties']['records']['items']['required']==['project','evidence','createdAt']
          assert portfolio['properties']['records']['items']['properties']['project']['maxLength']==120
          assert portfolio['properties']['records']['items']['properties']['evidence']['maxLength']==1000
          contract=json.loads(Path('data/website-builder-contract.json').read_text(encoding='utf-8'))
          assert contract['id']=='faa-website-builder-contract/v1'
          assert contract['properties']['project']['properties']['type']['const']=='website'
          assert contract['properties']['project']['properties']['status']['enum']==['draft','testing','preview','production']
          print('Assessment record contract passed')
          print('Portfolio record contract passed')
          print('Website project model contract passed')
          print('Website Builder contract passed')
          PY

      - name: Validate Website Builder contract bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'faa-website-builder-contract/v1' website-builder/contract-bridge.js
          grep -q 'function toContract' website-builder/contract-bridge.js
          grep -q 'function validate' website-builder/contract-bridge.js
          grep -q 'function readiness' website-builder/contract-bridge.js
          grep -q 'window.FAAWebsiteContract' website-builder/contract-bridge.js
          echo 'Website Builder contract bridge markers passed'

      - name: Execute Website Builder contract bridge
        shell: bash
        run: node qa/website-builder-contract-test.js

      - name: Full A-to-Z static smoke test
        shell: bash
        run: python3 qa/smoke-test.py

      - name: Check navigation targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html_files=list(Path('.').rglob('*.html'))
          bad=[]
          for f in html_files:
              text=f.read_text(encoding='utf-8',errors='ignore')
              for target in re.findall(r'href=["\']([^"\'#?]+)', text):
                  if target.startswith(('http://','https://','mailto:','tel:','javascript:')): continue
                  p=(f.parent/target).resolve()
                  if p.is_dir(): p=p/'index.html'
                  if not p.exists(): bad.append((str(f),target))
          if bad:
              print('Broken local links:')
              for x in bad: print(x[0], '->', x[1])
              raise SystemExit(1)
          print(f'Checked local links in {len(html_files)} HTML files')
          PY

      - name: Evidence Portfolio functional and safety markers
        shell: bash
        run: |
          set -euo pipefail
          file=portfolio/index.html
          for marker in 'EVIDENCE-FIRST LEARNING' 'faa-portfolio-v1' 'function removeRecord' 'exportBtn' 'Portfolio ≠ accreditation' 'const safeUrl' 'new URL(s)' 'replaceChildren'; do
            grep -q "$marker" "$file" || { echo "Evidence Portfolio missing marker: $marker"; exit 1; }
          done
          if grep -Eq "innerHTML[[:space:]]*=.*r\.url" "$file"; then echo 'Unsafe portfolio URL interpolation detected'; exit 1; fi
          echo 'Evidence Portfolio functional and URL-safety markers passed'

      - name: Website Builder functional markers
        shell: bash
        run: |
          set -euo pipefail
          file=website-builder/index.html
          for marker in 'Live Website Preview' 'Automated Website Tests' 'Export Website' 'function render' 'function runTests' 'function exportSite'; do
            grep -q "$marker" "$file" || { echo "Website Builder missing marker: $marker"; exit 1; }
          done
          echo 'Website Builder functional markers passed'

      - name: Website Project runtime-safety markers
        shell: bash
        run: |
          set -euo pipefail
          file=website-builder/project.html
          grep -q 'function render' "$file"
          grep -q 'function renderHistory' "$file"
          grep -q 'getElementById' "$file"
          grep -q 'replaceChildren' "$file"
          if grep -Eq '\$\(.(fill|state|validationStatus|versionStatus|releaseStatus|history)' "$file"; then
            echo 'Undefined $() DOM helper detected in Website Project'; exit 1
          fi
          if grep -Eq 'history.*innerHTML|innerHTML.*history' "$file"; then
            echo 'Unsafe Website Project history rendering detected'; exit 1
          fi
          echo 'Website Project runtime-safety markers passed'

      - name: Check for obvious secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' .; then
            echo 'Potential secret detected'; exit 1
          fi

      - name: Builder safety checks
        shell: bash
        run: |
          set -euo pipefail
          file=builder/index.html
          grep -q 'downloadProject\|downloadProject' "$file"
          grep -q 'runTests' "$file"
          grep -q 'arbitrary user code' "$file"
          grep -q 'textContent\|esc(' "$file"
          if grep -Eq 'innerHTML[[:space:]]*=[[:space:]]*[^;]*(project|user|input|value)' "$file"; then
            echo 'Potential unsafe direct HTML interpolation detected in Builder'; exit 1
          fi
          echo 'Builder safety markers and output-boundary checks passed'

      - name: Sitemap checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          sitemap=Path('sitemap.xml')
          root=ET.parse(sitemap).getroot()
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text.strip() for x in root.findall('sm:url/sm:loc',ns) if x.text and x.text.strip()]
          assert root.tag.endswith('urlset'), 'Invalid sitemap root'
          assert urls, 'Sitemap contains no URLs'
          assert len(urls)==len(set(urls)), 'Sitemap contains duplicate URLs'
          base='https://panoskhan.github.io/free-ai-academy-greece'
          assert all(u.startswith(base+'/') or u==base+'/' for u in urls), 'Sitemap contains an unexpected URL origin'
          required=['/about/','/academy-standard/','/student-path/','/student-dashboard/','/portfolio/','/projects/','/assessment/','/accessibility/','/certificates/','/contact/','/privacy/','/terms/','/builder/','/builder/project.html','/creator-dashboard/','/creator-dashboard/workspace.html','/creator-dashboard/academy-manager.html','/creator-dashboard/academy-editor.html','/creator-dashboard/github-connect.html','/creator-dashboard/deployment-dashboard.html','/creator-dashboard/website-project.html','/preview/','/release-center/','/release-center/history.html','/release-center/audit-log.html','/qa/link-checklist.html','/qa/launch-checklist.html','/website-builder/','/website-builder/project.html']
          for path in required: assert base+path in urls, f'Missing sitemap entry: {path}'
          for url in urls:
              path=url[len(base):].lstrip('/')
              local=Path('index.html') if not path else Path(path)
              if local.is_dir(): local=local/'index.html'
              assert local.exists(), f'Sitemap target missing: {url}'
          print(f'Sitemap XML and URL set passed: {len(urls)} URLs')
          PY

  published-verify:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages propagation
        shell: bash
        run: sleep 90

      - name: Verify every published sitemap URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time, urllib.request, xml.etree.ElementTree as ET
          root=ET.parse('sitemap.xml').getroot(); ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text.strip() for x in root.findall('sm:url/sm:loc',ns) if x.text]; failed=[]
          for url in urls:
              ok=False; last=''
              for attempt in range(1,8):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Free-AI-Academy-QA/1.0'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          code=r.status; body=r.read(4096).lower()
                      if code==200 and b'<html' in body: ok=True; break
                      last=f'HTTP {code}'
                  except Exception as exc: last=str(exc)
                  time.sleep(10)
              if not ok: failed.append((url,last))
          print(f'Published sitemap URLs verified: {len(urls)}')
          if failed:
              for url,reason in failed: print('FAILED',url,reason)
              raise SystemExit(1)
          print('Every sitemap URL returned HTTP 200 HTML')
          PY

      - name: Verify published GitHub Pages smoke routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://panoskhan.github.io/free-ai-academy-greece'
          for path in '/' '/courses/' '/student-dashboard/' '/portfolio/' '/builder/' '/builder/project.html' '/creator-dashboard/' '/creator-dashboard/deployment-dashboard.html' '/creator-dashboard/website-project.html' '/preview/' '/release-center/' '/release-center/audit-log.html' '/website-builder/' '/website-builder/project.html'; do
            ok=0
            for attempt in 1 2 3 4 5 6 7; do
              code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$base$path" || true)
              if [ "$code" = '200' ]; then ok=1; break; fi
              sleep 10
            done
            test "$ok" -eq 1 || { echo "Published page failed: $path HTTP $code"; exit 1; }
            grep -qi '<html' /tmp/page.html
          done
          echo 'Published GitHub Pages smoke routes passed'
