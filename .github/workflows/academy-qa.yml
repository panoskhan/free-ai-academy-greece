name: Academy QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate core files
        shell: bash
        run: |
          set -euo pipefail
          files=(index.html courses/ai-foundations.html courses/prompt-engineering.html courses/web-foundations.html courses/first-ai-tool.html courses/github-self-hosting.html courses/responsible-ai.html student-path/index.html projects/index.html assessment/index.html accessibility/index.html certificates/index.html builder/index.html creator-dashboard/index.html creator-dashboard/github-connect.html preview/index.html qa/link-checklist.html qa/launch-checklist.html sitemap.xml robots.txt)
          for f in "${files[@]}"; do test -f "$f" || { echo "Missing: $f"; exit 1; }; done
          echo "Core files present: ${#files[@]}"
      - name: Check HTML basics
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' f; do
            grep -qi '<!doctype html>' "$f" || { echo "No doctype: $f"; bad=1; }
            grep -qi 'lang="el"' "$f" || { echo "Missing Greek lang: $f"; bad=1; }
            grep -qi '<meta charset=' "$f" || { echo "Missing charset: $f"; bad=1; }
            grep -qi 'name="viewport"' "$f" || { echo "Missing viewport: $f"; bad=1; }
          done < <(find . -name '*.html' -not -path './.git/*' -print0)
          test "$bad" -eq 0
      - name: Check navigation targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html_files=list(Path('.').rglob('*.html'))
          bad=[]
          for f in html_files:
              text=f.read_text(encoding='utf-8',errors='ignore')
              for target in re.findall(r'href=["\']([^"\'#?]+)', text):
                  if target.startswith(('http://','https://','mailto:','javascript:')): continue
                  p=(f.parent/target).resolve()
                  if not p.exists(): bad.append((str(f),target))
          if bad:
              print('Broken local links:')
              for source,target in bad: print(source, '->', target)
              raise SystemExit(1)
          print(f'Checked local links in {len(html_files)} HTML files')
          PY
      - name: Check for obvious secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' .; then
            echo 'Potential secret detected'; exit 1
          fi
      - name: Builder safety checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'downloadProject' builder/index.html
          grep -q 'runTests' builder/index.html
          grep -q 'arbitrary user code' builder/index.html
          echo 'Builder preview/export/test controls present'
      - name: Sitemap checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<urlset' sitemap.xml
          for path in '/student-path/' '/projects/' '/assessment/' '/accessibility/' '/certificates/' '/builder/' '/creator-dashboard/' '/creator-dashboard/github-connect.html' '/preview/' '/qa/link-checklist.html' '/qa/launch-checklist.html'; do
            grep -q "$path" sitemap.xml || { echo "Missing sitemap URL: $path"; exit 1; }
          done
          echo 'Sitemap checks passed'
