name: Browser A-Z QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/academy-http.log 2>&1 &
          echo $! >/tmp/academy-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/academy-http.log
          exit 1

      - name: Test every page, button, and internal link
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/browser-smoke.mjs

      - name: Stop local site
        if: always()
        run: kill "$(cat /tmp/academy-http.pid)" 2>/dev/null || true
