name: Builder Interaction QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node qa/builder-interaction-contract-test.js
      - run: node --check qa/builder-interaction-contract-test.js
