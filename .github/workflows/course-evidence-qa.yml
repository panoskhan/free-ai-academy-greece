name: Course Evidence Template QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile qa/course-evidence-template-test.py
      - name: Course evidence contract
        run: python qa/course-evidence-template-test.py
