name: Published Route Verification

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

jobs:
  published-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages propagation
        shell: bash
        run: sleep 90

      - name: Verify every published sitemap URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          base='https://panoskhan.github.io/free-ai-academy-greece'
          root=ET.parse('sitemap.xml').getroot()
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text.strip() for x in root.findall('sm:url/sm:loc',ns) if x.text and x.text.strip()]
          assert urls, 'Published sitemap contains no URLs'
          assert len(urls)==len(set(urls)), 'Published sitemap contains duplicate URLs'

          failed=[]
          for url in urls:
              ok=False
              last=''
              for attempt in range(1,8):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Free-AI-Academy-QA/1.0'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          code=response.status
                          body=response.read(8192).lower()
                      if code == 200 and b'<html' in body and b'<title' in body:
                          ok=True
                          break
                      last=f'HTTP {code} without expected HTML markers'
                  except Exception as exc:
                      last=str(exc)
                  time.sleep(10)
              if not ok:
                  failed.append((url,last))
              else:
                  print('PASS',url)

          print(f'Published sitemap URLs checked: {len(urls)}')
          if failed:
              print('Published URL failures:')
              for url, reason in failed:
                  print(f'FAIL {url} :: {reason}')
              raise SystemExit(1)
          print('Every sitemap URL returned HTTP 200 HTML')
          PY

      - name: Verify critical published content
        shell: bash
        run: |
          set -euo pipefail
          base='https://panoskhan.github.io/free-ai-academy-greece'

          fetch() {
            local path="$1"
            local out="$2"
            curl -L -fsS --max-time 20 "$base$path" -o "$out"
            grep -qi '<html' "$out"
            grep -qi '<title' "$out"
          }

          fetch '/portfolio/' /tmp/portfolio.html
          grep -qi 'Evidence Portfolio' /tmp/portfolio.html
          grep -qi 'Course evidence templates' /tmp/portfolio.html
          grep -qi 'Portfolio ≠ accreditation' /tmp/portfolio.html

          fetch '/' /tmp/home.html
          grep -qi 'Free AI Academy Greece' /tmp/home.html

          fetch '/student-dashboard/' /tmp/dashboard.html
          grep -qi 'Student Dashboard' /tmp/dashboard.html

          echo 'Critical published content checks passed'

      - name: Verify published sitemap directly
        shell: bash
        run: |
          set -euo pipefail
          curl -L -fsS --max-time 20 'https://panoskhan.github.io/free-ai-academy-greece/sitemap.xml' -o /tmp/sitemap.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/sitemap.xml').getroot()
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text.strip() for x in root.findall('sm:url/sm:loc',ns) if x.text and x.text.strip()]
          assert urls
          assert root.tag.endswith('urlset')
          assert len(urls)==len(set(urls))
          required=['/portfolio/','/student-dashboard/','/assessment/','/builder/','/website-builder/']
          base='https://panoskhan.github.io/free-ai-academy-greece'
          for path in required:
              assert base+path in urls, f'Missing published sitemap entry: {path}'
          print(f'Published sitemap valid: {len(urls)} URLs')
          PY
