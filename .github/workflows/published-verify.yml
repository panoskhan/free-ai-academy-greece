name: Published Route Verification

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

jobs:
  published-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify published GitHub Pages smoke routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://panoskhan.github.io/free-ai-academy-greece'
          routes=(
            '/'
            '/courses/'
            '/student-dashboard/'
            '/portfolio/'
            '/builder/'
            '/builder/project.html'
            '/creator-dashboard/'
            '/creator-dashboard/deployment-dashboard.html'
            '/creator-dashboard/website-project.html'
            '/preview/'
            '/release-center/'
            '/release-center/audit-log.html'
            '/website-builder/'
            '/website-builder/project.html'
          )
          for path in "${routes[@]}"; do
            ok=0
            code='000'
            for attempt in 1 2 3 4 5 6 7; do
              code=$(curl -L -sS --max-time 20 -o /tmp/page.html -w '%{http_code}' "$base$path" || true)
              if [ "$code" = '200' ]; then ok=1; break; fi
              sleep 10
            done
            test "$ok" -eq 1 || { echo "Published page failed: $path HTTP $code"; exit 1; }
            grep -qi '<html' /tmp/page.html || { echo "Not HTML: $path"; exit 1; }
            grep -qi '<title>' /tmp/page.html || { echo "Missing title: $path"; exit 1; }
          done

          # Verify that the newly released portfolio is not merely a stale/empty route.
          curl -L -fsS --max-time 20 "$base/portfolio/" -o /tmp/portfolio.html
          grep -qi 'Evidence Portfolio' /tmp/portfolio.html
          grep -qi 'Learn → Build → Test → Document → Publish → Reflect' /tmp/portfolio.html

          echo 'Published GitHub Pages smoke routes and Portfolio content checks passed'

      - name: Verify published sitemap
        shell: bash
        run: |
          set -euo pipefail
          curl -L -fsS --max-time 20 'https://panoskhan.github.io/free-ai-academy-greece/sitemap.xml' -o /tmp/sitemap.xml
          grep -q '/portfolio/' /tmp/sitemap.xml
          grep -q '/student-dashboard/' /tmp/sitemap.xml
          grep -q '/assessment/' /tmp/sitemap.xml
          echo 'Published sitemap contains required Academy routes'
